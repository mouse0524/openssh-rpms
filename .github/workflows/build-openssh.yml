        uses: actions/download-artifact@v4
        with:
          name: rpms-${{ matrix.target }}-x86_64
          path: pkg

      - name: Extract package
        run: |
          set -e
          tar -xzf pkg/*.tar.gz -C pkg --strip-components=1
          ls -lh pkg/

      - name: Start systemd container
        run: |
          set -e
          docker run --privileged -d --name it "${{ matrix.image }}" /usr/sbin/init
          for i in $(seq 1 60); do
            STATE="$(docker exec it systemctl is-system-running 2>/dev/null || true)"
            case "$STATE" in running|degraded) echo "systemd ready: $STATE"; break ;; esac
            sleep 2
          done
          docker exec it systemctl is-system-running 2>/dev/null || true

      - name: Install packages (install.sh)
        run: |
          set -e
          docker cp pkg/. it:/pkg
          docker exec -w /pkg it bash ./install.sh

      - name: Verify installation
        run: |
          set -e
          docker exec it ssh -V
          docker exec it sh -c "systemctl is-active ${{ matrix.svc }} || systemctl is-active sshd"
          echo "install-test OK: ${{ matrix.target }}"

  release:
    name: Publish Release
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SSH_VERSION: ${{ needs.resolve.outputs.ssh_version }}
      SSL_VERSION: ${{ needs.resolve.outputs.ssl_version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpms-*
          path: release-assets
          merge-multiple: true

      - name: Prepare Release
        run: |
          set -e
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 60
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: OpenSSH ${{ env.SSH_VERSION }} + OpenSSL ${{ env.SSL_VERSION }} RPMs
          target_commitish: ${{ github.sha }}
          files: release-assets/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
