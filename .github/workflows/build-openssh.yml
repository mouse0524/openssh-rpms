    env:
      SSH_VERSION: ${{ needs.resolve.outputs.ssh_version }}
      SSL_VERSION: ${{ needs.resolve.outputs.ssl_version }}
      TARGET_ID: ${{ matrix.target }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      BASE_IMAGE: ${{ matrix.image }}
      FORCE_OS_TAG: ${{ matrix.os_tag }}
      UOS20: ${{ matrix.uos20 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove repository source archives
        run: rm -f openssh-*.tar.gz openssl-*.tar.gz

      - name: Download verified sources
        uses: actions/download-artifact@v4
        with:
          name: verified-sources
          path: .

      - name: Build builder image
        run: |
          set -e
          docker build --platform "$TARGET_PLATFORM" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t "openssh-builder:${TARGET_ID}-${TARGET_ARCH}" .

      - name: Build RPMs
        run: |
          set -e
          mkdir -p output
          docker run --rm --platform "$TARGET_PLATFORM" \
            -e FORCE_OS_TAG="$FORCE_OS_TAG" \
            -e UOS20="$UOS20" \
            -v "$GITHUB_WORKSPACE:/build" \
            -v "$GITHUB_WORKSPACE/output:/opt" \
            "openssh-builder:${TARGET_ID}-${TARGET_ARCH}" \
            bash -c "cd /build && printf '2\\n' | bash build_openssh.sh"

      - name: Collect artifact
        run: |
          set -e
          SOURCE="$(find output -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          [ -n "$SOURCE" ] || { echo "未找到安装包压缩文件"; exit 1; }
          tar -tzf "$SOURCE" | grep -q '/install.sh$' \
            || { echo "安装包压缩文件中缺少 install.sh"; exit 1; }
          case "$TARGET_ID" in
            debian-*|ubuntu-*|deepin-*) PKG_KIND="debs" ;;
            *) PKG_KIND="rpms" ;;
          esac
          mkdir -p dist
          cp "$SOURCE" "dist/openssh-${SSH_VERSION}-${PKG_KIND}-${TARGET_ID}-${TARGET_ARCH}.tar.gz"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

